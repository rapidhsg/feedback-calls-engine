name: repair-tasks

# One-time: rerun Oct 15-21 so the 34 already-loaded call tasks get working links. Delete after it runs.

on:
  push:
    paths:
      - .github/workflows/repair-tasks.yml

permissions:
  contents: read

concurrency:
  group: feedback-calls
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rapidhsg/rr-metrics-data
          ref: data
          path: databranch
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repair call task links
        env:
          ACCULYNX_API_KEY: ${{ secrets.ACCULYNX_API_KEY }}
          GHL_FEEDBACK_TOKEN: ${{ secrets.GHL_FEEDBACK_TOKEN }}
          DATA_DIR: databranch/data
          FC_DATE: "2026-10-15:2026-10-21"
        run: node scripts/feedback_calls.mjs

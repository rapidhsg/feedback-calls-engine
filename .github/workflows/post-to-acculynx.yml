name: post-to-acculynx

# Every 15 minutes, post new feedback call form answers to the customer's AccuLynx job and tag the rep.
# See scripts/post_to_acculynx.mjs. Posted submissions are remembered in state/acculynx_posted.json.

on:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what it would post, write nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post-to-acculynx
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Post form answers to AccuLynx
        env:
          ACCULYNX_API_KEY: ${{ secrets.ACCULYNX_API_KEY }}
          GHL_FEEDBACK_TOKEN: ${{ secrets.GHL_FEEDBACK_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node scripts/post_to_acculynx.mjs

      - name: Save which forms were posted
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "Record feedback forms posted to AccuLynx"
            git pull --rebase -q && git push -q
          fi

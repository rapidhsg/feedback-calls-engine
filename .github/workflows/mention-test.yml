name: mention-test

# One-time test: does an @name in a job message posted through the AccuLynx API tag and notify the user?
# Posts one comment on the Mario Simmons job. Delete this file after the test.

on:
  push:
    paths:
      - .github/workflows/mention-test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Post test comment
        env:
          ACCULYNX_API_KEY: ${{ secrets.ACCULYNX_API_KEY }}
        run: |
          JOB=21d4f0b9-d67c-4e5d-a9c1-c584e282117f
          curl -sS -w "\nHTTP %{http_code}\n" -X POST "https://api.acculynx.com/api/v2/jobs/$JOB/messages" \
            -H "Authorization: Bearer $ACCULYNX_API_KEY" -H "Content-Type: application/json" -H "Accept: application/json" \
            -d '{"message":"TEST from the feedback call system, please ignore. @Michael Dietrich did this tag you?"}'
